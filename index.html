<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BroGame Mezitli: PlayStation 5, racing simülatör, bilardo ve masa tenisi. Online rezervasyon.">
<link rel="icon" href="logo.svg">
<title>BroGame Rezervasyon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: dark arcade-lounge site; hero states what the place is, then the four stations as "machines", then a scoreboard-style booking board. */
:root{
  --night:#0d0c1c; --night-2:#16142e; --night-3:#1e1b3d;
  --rail:#55518b; --rail-dark:#3b3873; --felt:#33246b;
  --chalk:#f4f2ff; --muted:#aaa5d8; --line:#2d2a52;
  --accent:#5cc8ff; --accent-ink:#06121c;
  --gold:#ffd166; --ok:#3ddc97; --err:#ff6b81; --warn:#ffb454;
  --walk:#ff9f5a;
  --f-display:"Russo One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-digit:"Chakra Petch","Rubik",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--chalk)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;
  background:radial-gradient(1000px 560px at 50% -220px,#2a1f63 0%,transparent 70%),var(--night);min-height:100vh}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
.muted{color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
[dir=rtl] .eyebrow{letter-spacing:0}

/* demo strip */
.demo{background:#2a2350;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);padding-block:8px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.demo nav{display:flex;gap:6px;flex-wrap:wrap}
.demo nav a{color:var(--chalk);text-decoration:none;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--night-2)}
.demo nav a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(13,12,28,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--rail)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;gap:4px;margin-inline-start:12px}
.nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px}
.nav a:hover{color:var(--chalk);background:var(--night-2)}
@media (max-width:760px){.nav{display:none}}
.langs{display:flex;background:var(--night-2);border:1px solid var(--line);border-radius:99px;padding:2px}
.langs button{border:0;background:transparent;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.langs button.on{background:var(--rail);color:var(--chalk)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--err);color:#2a0008}
.btn.gold{background:var(--gold);color:#241a00}
.btn.google{background:#fff;color:#1f1f1f}
.btn.google svg{width:18px;height:18px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13.5px}

/* hero */
.hero{padding-block:44px 28px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,62px);line-height:1.02;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:17px;color:var(--muted);max-width:52ch}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 12px;border-radius:99px;background:var(--night-2);border:1px solid var(--line)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--err)}
.status.open i{background:var(--ok);box-shadow:0 0 0 4px rgba(61,220,151,.18)}
.marquee{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mq{background:linear-gradient(160deg,var(--night-3),var(--night-2));border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mq svg{width:34px;height:34px;color:var(--accent)}
.mq b{font-family:var(--f-digit);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.mq span{font-size:13px;color:var(--muted)}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-block:28px 16px}}

/* sections */
section.block{padding-block:28px}
.block h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,32px)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.cards{grid-template-columns:1fr}}
.card{background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .ic{width:44px;height:44px;border-radius:12px;background:var(--felt);display:grid;place-items:center;color:var(--chalk)}
.card .ic svg{width:26px;height:26px}
.card h3{font-size:17px;font-weight:700}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted)}
.card .meta b{color:var(--chalk);font-family:var(--f-digit);font-variant-numeric:tabular-nums}

/* booking board */
.board{background:var(--night-2);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:18px}
.step{display:flex;flex-direction:column;gap:10px}
.step>label,.step>.eyebrow{display:flex;gap:8px;align-items:center}
.num{width:22px;height:22px;border-radius:50%;background:var(--rail);color:var(--chalk);display:inline-grid;place-items:center;font-family:var(--f-digit);font-size:12px;font-weight:700;letter-spacing:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--night);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500}
.seg button svg{width:20px;height:20px;color:var(--muted)}
.seg button.on{border-color:var(--accent);background:rgba(92,200,255,.12)}
.seg button.on svg{color:var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{flex:none;border:1px solid var(--line);background:var(--night);border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:64px}
.days button small{font-size:11.5px;color:var(--muted)}
.days button b{font-family:var(--f-digit);font-size:20px;line-height:1.1}
.days button.on{border-color:var(--accent);background:rgba(92,200,255,.12)}
.days button.off{opacity:.45}
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.hours button{border:1px solid var(--line);background:var(--night);border-radius:12px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.hours button b{font-family:var(--f-digit);font-size:18px;font-variant-numeric:tabular-nums}
.hours button small{font-size:11.5px;color:var(--ok)}
.hours button.few small{color:var(--warn)}
.hours button[disabled]{opacity:.38;cursor:default}
.hours button[disabled] small{color:var(--muted)}
.hours button.on{border-color:var(--accent);background:rgba(92,200,255,.14)}
.stations{display:flex;flex-wrap:wrap;gap:8px}
.stations button{border:1px solid var(--line);background:var(--night);border-radius:10px;padding:8px 12px;cursor:pointer;font-family:var(--f-digit);font-weight:700}
.stations button.on{border-color:var(--accent);background:rgba(92,200,255,.14)}
.summary{background:var(--night);border:1px dashed var(--rail);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.summary div{min-width:0}
.summary small{display:block;color:var(--muted);font-size:12px}
.summary b{font-family:var(--f-digit);font-size:17px;overflow-wrap:anywhere}
@media (max-width:620px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{background:var(--night);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;border:1px solid}
.msg.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.msg.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:color-mix(in srgb,var(--err) 10%,transparent)}
.msg.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.done{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.done h3{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--ok)}

/* info */
.info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.info{grid-template-columns:1fr}}
.panel{background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.htable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.htable td{padding:7px 0;border-top:1px solid var(--line)}
.htable tr:first-child td{border-top:0}
.htable td:last-child{text-align:end;font-family:var(--f-digit)}
.htable tr.today td{color:var(--accent)}
.contact a{color:var(--chalk)}
footer.site{border-top:1px solid var(--line);margin-top:28px;padding-block:20px;color:var(--muted);font-size:13px}

/* my bookings */
.blist{display:flex;flex-direction:column;gap:10px}
.bitem{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.bitem .when{font-family:var(--f-digit);text-align:center;background:var(--night);border-radius:10px;padding:8px 10px;min-width:70px}
.bitem .when b{display:block;font-size:20px;line-height:1.1}
.bitem .when small{color:var(--muted);font-size:11.5px}
.bitem.past,.bitem.cancelled{opacity:.55}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.pill.walk{color:var(--walk);border-color:color-mix(in srgb,var(--walk) 40%,transparent)}
@media (max-width:560px){.bitem{grid-template-columns:auto minmax(0,1fr)}.bitem .act{grid-column:1/-1}}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--night-2);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--rail);border-color:var(--rail)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--f-digit);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--night-2)}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%;font-size:12.5px}
table.grid th,table.grid td{padding:0;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line)}
table.grid thead th{position:sticky;top:0;background:var(--night-3);font-family:var(--f-digit);font-weight:700;padding:8px 4px;min-width:54px;text-align:center}
table.grid th.st{position:sticky;inset-inline-start:0;background:var(--night-3);text-align:start;padding:8px 10px;white-space:nowrap;z-index:1;min-width:120px}
table.grid th.st.closed{color:var(--muted);text-decoration:line-through}
table.grid tr.sec th{background:var(--felt);text-align:start;padding:6px 10px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.cell{display:block;width:100%;height:36px;border:0;background:transparent;cursor:pointer;font-size:11px;font-weight:700;color:var(--chalk);padding:0 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell:hover{background:rgba(92,200,255,.1)}
.cell.bk{background:rgba(92,200,255,.28)}
.cell.wk{background:rgba(255,159,90,.32)}
.cell.cl{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.05) 6px 12px);cursor:default}
.cell.past{opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.detail{background:var(--night);border:1px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.settings{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.settings{grid-template-columns:1fr}}
.hrow{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.hrow select{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:0}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.strow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.strow input{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.sechead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sechead input{width:90px;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.gate{max-width:440px;margin:40px auto;text-align:center;align-items:center}
.sheet{position:fixed;inset:0;background:rgba(5,4,14,.7);display:grid;place-items:center;padding:16px;z-index:30}
.sheet .panel{width:min(420px,100%)}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;z-index:40}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------------- time (Turkey = UTC+3, no DST) ---------------- */
const TZ=3*3600e3;
const ist=ms=>new Date(ms+TZ);
const pad=n=>String(n).padStart(2,"0");
function keyOf(ms){ const d=ist(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
const todayKey=()=>keyOf(Date.now());
function addDays(key,n){ const [y,m,d]=key.split("-").map(Number); return keyOf(Date.UTC(y,m-1,d+n,12)-TZ); }
function dowOf(key){ const [y,m,d]=key.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function startMs(key,h){ const [y,m,d]=key.split("-").map(Number); return Date.UTC(y,m-1,d,h)-TZ; }
const hLabel=h=>`${pad(((h%24)+24)%24)}:00`;
function slotId(stationId,ms){ const d=ist(ms); return `${stationId}__${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}${pad(d.getUTCHours())}`; }
function dayHours(set,key){ const h=set.hours[dowOf(key)]||{closed:true}; if(h.closed) return []; const a=[]; for(let x=h.open;x<h.close;x++) a.push(x); return a; }
function dateLabel(key,short){ const d=dowOf(key); const n=key.slice(8,10).replace(/^0/,""); if(key===todayKey()) return t("today"); if(key===addDays(todayKey(),1)) return t("tomorrow"); return (short?t("daysS")[d]:t("days")[d])+" "+n; }
function longDate(key){ const [y,m,d]=key.split("-").map(Number); return new Intl.DateTimeFormat(S.lang==="ar"?"ar-SY":S.lang,{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"}).format(new Date(Date.UTC(y,m-1,d))); }
function openStatus(set){
  const now=Date.now(); const k=todayKey();
  for(const key of [addDays(k,-1),k]){ const hs=set.hours[dowOf(key)]; if(!hs||hs.closed) continue;
    const a=startMs(key,hs.open), b=startMs(key,hs.close); if(now>=a&&now<b) return {open:true,until:hLabel(hs.close)}; }
  const hs=set.hours[dowOf(k)]; if(hs&&!hs.closed&&now<startMs(k,hs.open)) return {open:false,opens:hLabel(hs.open)};
  return {open:false};
}

function makeDemo(){
  const KEY="brogame_book_demo_v1"; let mem=null; const subs=new Set();
  const read=()=>{ try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return mem; };
  const write=d=>{ mem=d; try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} subs.forEach(f=>f()); };
  const on=f=>{ subs.add(f); f(); return ()=>subs.delete(f); };
  if(!read()){
    const d={session:"u-demo",users:{"u-demo":{name:"Demo Owner",email:CONFIG.ownerEmails[0]}},settings:null,slots:{},bookings:{}};

    plan.forEach(([st,date,h,n],i)=>{ const id="b"+i; const sec=st.startsWith("ps5")?"ps5":st.startsWith("sim")?"racing":st.startsWith("bil")?"billiards":"pingpong";
      const ids=[]; for(let j=0;j<n;j++){ const ms=startMs(date,h+j); const sid=slotId(st,ms); ids.push(sid); d.slots[sid]={uid:"u-x"+i,bookingId:id,kind:"booking",start:ms,stationId:st}; }
      d.bookings[id]={uid:"u-x"+i,name:names[i%5],phone:"0532 000 00 0"+i,email:"ornek"+i+"@gmail.com",sectionId:sec,stationId:st,date,startHour:h,hours:n,slotIds:ids,price:300*n,status:"active",createdAt:Date.now(),start:startMs(date,h)}; });
    [["ps5-4",k,19],["ps5-4",k,20],["bil-2",k,19]].forEach(([st,date,h])=>{ const ms=startMs(date,h); d.slots[slotId(st,ms)]={uid:"owner",bookingId:null,kind:"walkin",start:ms,stationId:st}; });
    write(d);
  }
  window.addEventListener("storage",e=>{ if(e.key===KEY) subs.forEach(f=>f()); });
  return {
    onAuth(cb){ let last="?"; on(()=>{ const d=read(); const u=d.session&&d.users[d.session]; const k=u?d.session:null; if(k!==last){ last=k; cb(u?{uid:d.session,name:u.name,email:u.email,photo:""}:null); } }); },
    async signIn(){ S.sheet="demo"; render(); },
    async demoSign(name,owner){ const d=read(); const uid=owner?"u-demo":"u-"+Math.random().toString(36).slice(2,7); d.users[uid]={name,email:owner?CONFIG.ownerEmails[0]:name.toLowerCase().replace(/[^a-z0-9]+/g,".")+"@gmail.com"}; d.session=uid; write(d); },
    async signOut(){ const d=read(); d.session=null; write(d); },
    watchSettings(cb){ return on(()=>cb(read().settings)); },
    async saveSettings(s){ const d=read(); d.settings=s; write(d); },
    watchSlots(from,to,cb){ return on(()=>{ const d=read(); cb(Object.entries(d.slots).filter(([,s])=>s.start>=from&&s.start<to).map(([id,s])=>({id,...s}))); }); },
    async createBooking(uid,data){ const d=read(); if(data.slotIds.some(id=>d.slots[id])) throw bad("taken"); if(data.start<=Date.now()) throw bad("taken");
      const id="b"+Date.now(); data.slotIds.forEach((sid,j)=>{ d.slots[sid]={uid,bookingId:id,kind:"booking",start:data.start+j*3600e3,stationId:data.stationId}; });
      d.bookings[id]={...data,uid,status:"active",createdAt:Date.now()}; write(d); return id; },
    async cancelBooking(b){ const d=read(); const x=d.bookings[b.id]; if(!x) return; x.status="cancelled"; x.cancelledAt=Date.now(); (x.slotIds||[]).forEach(s=>{ if(d.slots[s]&&d.slots[s].bookingId===b.id) delete d.slots[s]; }); write(d); },
    watchMyBookings(uid,cb){ return on(()=>{ const d=read(); cb(Object.entries(d.bookings).filter(([,b])=>b.uid===uid).map(([id,b])=>({id,...b}))); }); },
    watchBookingsByDate(date,cb){ return on(()=>{ const d=read(); cb(Object.entries(d.bookings).filter(([,b])=>b.date===date).map(([id,b])=>({id,...b}))); }); },
    async addWalkin(stationId,ms){ const d=read(); const id=slotId(stationId,ms); if(d.slots[id]) throw bad("taken"); d.slots[id]={uid:"owner",bookingId:null,kind:"walkin",start:ms,stationId}; write(d); },
    async removeSlot(id){ const d=read(); delete d.slots[id]; write(d); }
  };
}
async function makeFirebase(){
  const base="https://www.gstatic.com/firebasejs/10.12.2/";
  const [A,Au,F]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
  const app=A.initializeApp(CONFIG.firebase); const auth=Au.getAuth(app); const db=F.getFirestore(app);
  const provider=new Au.GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
  Au.getRedirectResult(auth).catch(()=>{});
  const ms=v=>v&&v.toMillis?v.toMillis():(v??null);
  const TS=F.Timestamp;
  const mapB=d=>{ const x=d.data(); return {id:d.id,...x,start:ms(x.start),createdAt:ms(x.createdAt),cancelledAt:ms(x.cancelledAt)}; };
  return {
    onAuth(cb){ Au.onAuthStateChanged(auth,u=>cb(u&&{uid:u.uid,name:u.displayName||u.email,email:u.email,photo:u.photoURL||""})); },
    async signIn(){ try{ await Au.signInWithPopup(auth,provider); }catch(e){ if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) return Au.signInWithRedirect(auth,provider); if(e.code!=="auth/popup-closed-by-user") throw e; } },
    signOut(){ return Au.signOut(auth); },
    watchSettings(cb){ return F.onSnapshot(F.doc(db,"settings","main"),s=>cb(s.exists()?s.data():null),()=>cb(null)); },
    saveSettings(s){ return F.setDoc(F.doc(db,"settings","main"),s); },
    watchSlots(from,to,cb){ return F.onSnapshot(F.query(F.collection(db,"slots"),F.where("start",">=",TS.fromMillis(from)),F.where("start","<",TS.fromMillis(to))),
      s=>cb(s.docs.map(d=>({id:d.id,...d.data(),start:ms(d.data().start)}))),()=>cb([])); },
    async createBooking(uid,data){
      const ref=F.doc(F.collection(db,"bookings")); const b=F.writeBatch(db);
      b.set(ref,{...data,uid,status:"active",start:TS.fromMillis(data.start),createdAt:F.serverTimestamp()});
      data.slotIds.forEach((sid,j)=>b.set(F.doc(db,"slots",sid),{uid,bookingId:ref.id,kind:"booking",start:TS.fromMillis(data.start+j*3600e3),stationId:data.stationId}));
      try{ await b.commit(); }catch(e){ throw bad("taken"); } return ref.id; },
    async cancelBooking(bk){ const b=F.writeBatch(db); b.update(F.doc(db,"bookings",bk.id),{status:"cancelled",cancelledAt:F.serverTimestamp()});
      const live=new Set(S.slots.filter(s=>s.bookingId===bk.id).map(s=>s.id));
      (bk.slotIds||[]).forEach(sid=>{ if(live.size===0||live.has(sid)) b.delete(F.doc(db,"slots",sid)); });
      await b.commit(); },
    watchMyBookings(uid,cb){ return F.onSnapshot(F.query(F.collection(db,"bookings"),F.where("uid","==",uid)),s=>cb(s.docs.map(mapB)),()=>cb([])); },
    watchBookingsByDate(date,cb){ return F.onSnapshot(F.query(F.collection(db,"bookings"),F.where("date","==",date)),s=>cb(s.docs.map(mapB)),()=>cb([])); },
    addWalkin(stationId,msv){ return F.setDoc(F.doc(db,"slots",slotId(stationId,msv)),{uid:auth.currentUser.uid,bookingId:null,kind:"walkin",start:TS.fromMillis(msv),stationId}); },
    removeSlot(id){ return F.deleteDoc(F.doc(db,"slots",id)); }
  };
}

/* booking logic */
function bookableDates(){ const n=set().bookDays||7; const k=todayKey(); return Array.from({length:n},(_,i)=>addDays(k,i)); }
function freeStationsFor(secId,date,startH,n){
  const sec=set().sections.find(s=>s.id===secId); if(!sec) return [];
  const hs=dayHours(set(),date); if(!hs.length||startH+n>hs[hs.length-1]+1) return [];
  if(startMs(date,startH)<=Date.now()) return [];
  const m=slotMap();
  return sec.stations.filter(st=>st.open&&Array.from({length:n},(_,j)=>slotId(st.id,startMs(date,startH+j))).every(id=>!m.has(id)));
}
function boardHTML(){
  const B=S.b; const secs=set().sections; const dates=bookableDates();
  if(!B.date||!dates.includes(B.date)) B.date=dates.find(d=>dayHours(set(),d).length)||dates[0];
  if(!secs.some(s=>s.id===B.sec)) B.sec=secs[0].id;
  const maxH=set().maxHours||4; if(B.hours>maxH) B.hours=maxH;
  if(S.done) return doneHTML();
  const hs=dayHours(set(),B.date);
  const starts=hs.filter(h=>h+B.hours<=hs[hs.length-1]+1);
  const hourBtns=starts.map(h=>{ const n=freeStationsFor(B.sec,B.date,h,B.hours).length; const past=startMs(B.date,h)<=Date.now();
    return `<button data-start="${h}" class="${B.start===h?"on":""} ${n>0&&n<=2?"few":""}" ${n===0?"disabled":""} aria-pressed="${B.start===h}"><b>${hLabel(h)}</b><small>${past?"—":n?t("freeN",{n:fmtN(n)}):t("full")}</small></button>`; }).join("");
  const anyFree=starts.some(h=>freeStationsFor(B.sec,B.date,h,B.hours).length);
  if(B.start!=null && !freeStationsFor(B.sec,B.date,B.start,B.hours).length){ B.start=null; B.station=""; }
  const free=B.start!=null?freeStationsFor(B.sec,B.date,B.start,B.hours):[];
  if(B.station && !free.some(s=>s.id===B.station)) B.station="";
  const sec=secs.find(s=>s.id===B.sec); const stName=B.station?(free.find(s=>s.id===B.station)||{}).name:t("autoPick");
  const msg=S.bMsg?`<div class="msg ${S.bMsg.k}" role="status">${esc(S.bMsg.t)}</div>`:"";
  return `
  <div class="step"><span class="eyebrow"><span class="num">1</span>${t("s1")}</span>
    <div class="seg">${secs.map(s=>`<button data-sec="${s.id}" class="${B.sec===s.id?"on":""}" aria-pressed="${B.sec===s.id}">${IC[s.id]||""}${esc(secName(s.id))}</button>`).join("")}</div></div>
  <div class="step"><span class="eyebrow"><span class="num">2</span>${t("s2")}</span>
    <div class="days">${dates.map(d=>{ const closed=!dayHours(set(),d).length; const [,, dd]=d.split("-");
      return `<button data-date="${d}" class="${B.date===d?"on":""} ${closed?"off":""}" ${closed?"disabled":""}><small>${d===todayKey()?t("today"):d===addDays(todayKey(),1)?t("tomorrow"):t("daysS")[dowOf(d)]}</small><b>${fmtN(Number(dd))}</b></button>`; }).join("")}</div></div>
  <div class="step"><span class="eyebrow"><span class="num">3</span>${t("s3")}</span>
    <div class="seg">${Array.from({length:maxH},(_,i)=>i+1).map(n=>`<button data-hours="${n}" class="${B.hours===n?"on":""}" aria-pressed="${B.hours===n}">${t("hoursN",{n:fmtN(n)})}</button>`).join("")}</div></div>
  <div class="step"><span class="eyebrow"><span class="num">4</span>${t("s4")}</span>
    ${anyFree?`<div class="hours">${hourBtns}</div>`:`<p class="muted">${t("noHours")}</p>`}</div>
  ${B.start!=null?`<div class="step"><span class="eyebrow"><span class="num">5</span>${t("s5")}</span>
    <div class="stations"><button data-station="" class="${!B.station?"on":""}">${t("autoPick")}</button>${free.map(s=>`<button data-station="${s.id}" class="${B.station===s.id?"on":""}">${esc(s.name)}</button>`).join("")}</div></div>
  <div class="step"><span class="eyebrow"><span class="num">6</span>${t("s6")}</span>
    <div class="summary">
      <div><small>${t("what")}</small><b>${esc(secName(B.sec))}</b></div>
      <div><small>${t("when")}</small><b>${esc(dateLabel(B.date,true))} · ${hLabel(B.start)}–${hLabel(B.start+B.hours)}</b></div>
      <div><small>${t("unit")}</small><b>${esc(stName)}</b></div>
      <div><small>${t("total")}</small><b>${fmtN(sec.price*B.hours)} ₺</b></div>
    </div>
    ${S.user?`<div class="fields">
      <div class="field"><label for="bName">${t("name")}</label><input id="bName" autocomplete="name" maxlength="60" value="${esc(B.name||(S.user.name||""))}"></div>
      <div class="field"><label for="bPhone">${t("phone")}</label><input id="bPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="05xx xxx xx xx" value="${esc(B.phone)}"></div>

async function doBook(){
  const B=S.b; const u=S.user; if(!u){ return backend.signIn(); }
  B.name=($("#bName")?.value||"").trim(); B.phone=($("#bPhone")?.value||"").trim();
  if(!B.name){ S.bMsg={k:"err",t:t("needName")}; return paintBoard(); }
  if(B.phone.replace(/\D/g,"").length<10){ S.bMsg={k:"err",t:t("needPhone")}; return paintBoard(); }
  const active=S.my.filter(b=>b.status==="active"&&b.start+b.hours*3600e3>Date.now()).length;
  if(active>=(set().maxActive||3)){ S.bMsg={k:"warn",t:t("tooMany",{n:fmtN(set().maxActive||3)})}; return paintBoard(); }
  const free=freeStationsFor(B.sec,B.date,B.start,B.hours);
  const st=B.station?free.find(s=>s.id===B.station):free[0];
  if(!st){ S.bMsg={k:"err",t:t("taken")}; return paintBoard(); }
  const sec=set().sections.find(s=>s.id===B.sec); const start=startMs(B.date,B.start);
  const data={name:B.name,phone:B.phone,email:u.email||"",sectionId:B.sec,stationId:st.id,stationName:st.name,date:B.date,startHour:B.start,hours:B.hours,
    slotIds:Array.from({length:B.hours},(_,j)=>slotId(st.id,start+j*3600e3)),price:sec.price*B.hours,start};
  S.busy=true; S.bMsg=null; paintBoard();
  try{ await backend.createBooking(u.uid,data); S.done=data; B.start=null; B.station=""; }
  catch(e){ S.bMsg={k:"err",t:e.code==="taken"?t("taken"):t("err")}; }
  S.busy=false; paintBoard();
}

function demoBar(){
  const el=$("#demo"); if(!DEMO){ el.hidden=true; return; } el.hidden=false; el.className="demo";
  el.innerHTML=`<div class="wrap"><span>${t("demo")}</span><nav><a href="#" class="${S.view==="home"?"on":""}">${t("dSite")}</a><a href="#my" class="${S.view==="my"?"on":""}">${t("dMy")}</a><a href="#admin" class="${S.view==="admin"?"on":""}">${t("dAdmin")}</a></nav></div>`;
}
function render(){
  document.documentElement.lang=S.lang; document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  demoBar(); const y=window.scrollY;
  $("#app").innerHTML=!S.authReady&&!DEMO?`${header()}<main class="wrap"><p class="muted" style="padding:40px 0">${t("loading")}</p></main>`:
    S.view==="my"?viewMy():S.view==="admin"?viewAdmin():viewHome();
  $("#layer").innerHTML=S.sheet==="demo"?`<div class="sheet"><form class="panel" id="demoForm"><h2>${t("demoSign")}</h2><div class="field"><label for="dn">${t("demoName")}</label><input id="dn" required maxlength="40"></div><div class="row"><button class="btn" type="submit">${t("demoGo")}</button><button class="btn ghost" type="button" data-act="sheet-close">${t("no")}</button></div></form></div>`:"";
  if(S.sheet) setTimeout(()=>$("#dn")?.focus(),30);
  window.scrollTo(0,y);
  resubscribe();
}
function paintBoard(){ const b=$("#board"); if(b){ const y=window.scrollY; b.innerHTML=boardHTML(); window.scrollTo(0,y);} else render(); resubscribe(); }
function route(){
  const h=(location.hash||"").replace("#","");
  const v=h==="my"?"my":h==="admin"?"admin":"home";
  const changed=v!==S.view; S.view=v; S.confirmId=null;
  render();
  if(v==="home"&&["book","sections","info"].includes(h)) setTimeout(()=>document.getElementById(h)?.scrollIntoView({behavior:"smooth"}),40);
  else if(changed) window.scrollTo(0,0);
}

/* subscriptions: slots window depends on view */
const SUB={slotsKey:null,slots:null,myKey:null,my:null,dayKey:null,day:null};
function resubscribe(){
  if(!backend) return;
  let from,to;
  if(S.view==="admin"&&S.adm.date){ from=startMs(S.adm.date,0); to=startMs(S.adm.date,31); }
  else { const k=todayKey(); from=startMs(addDays(k,-1),0); to=startMs(addDays(k,(set().bookDays||7)+1),8); }
  const sk=from+":"+to;
  if(sk!==SUB.slotsKey){ SUB.slots&&SUB.slots(); SUB.slotsKey=sk; SUB.slots=backend.watchSlots(from,to,list=>{ S.slots=list; softPaint(); }); }
  const mk=S.user?S.user.uid:null;
  if(mk!==SUB.myKey){ SUB.my&&SUB.my(); SUB.my=null; SUB.myKey=mk; S.my=[]; if(mk) SUB.my=backend.watchMyBookings(mk,list=>{ S.my=list; if(S.view==="my") softPaint(); }); }
  const dk=S.view==="admin"&&ownerOK()?S.adm.date:null;
  if(dk!==SUB.dayKey){ SUB.day&&SUB.day(); SUB.day=null; SUB.dayKey=dk; S.dayBookings=[]; if(dk) SUB.day=backend.watchBookingsByDate(dk,list=>{ S.dayBookings=list; softPaint(); }); }
}
let paintQ=false;
function softPaint(){ if(paintQ) return; paintQ=true; requestAnimationFrame(()=>{ paintQ=false;
  const a=document.activeElement; if(a&&(a.tagName==="INPUT"||a.tagName==="SELECT")&&S.view!=="admin"){ if(S.view==="home"){ return; } }
  if(S.view==="home") paintBoard(); else if(S.view==="admin"&&S.adm.tab==="set") return; else render(); }); }

/* ---------------- events ---------------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-lang],[data-act],[data-sec],[data-date],[data-hours],[data-start],[data-station],[data-tab],[data-adate],[data-cell],[data-scroll]"); if(!el) return;
  const d=el.dataset;
  if(d.scroll!==undefined){ const id=(el.getAttribute("href")||"").slice(1); const tgt=document.getElementById(id); if(tgt){ e.preventDefault(); tgt.scrollIntoView({behavior:"smooth"}); history.replaceState(null,"","#"); } return; }
  if(d.lang){ S.lang=d.lang; try{localStorage.setItem("bro_lang",S.lang);}catch(x){} return render(); }
  const B=S.b;
  if(d.sec){ B.sec=d.sec; B.start=null; B.station=""; S.bMsg=null; return paintBoard(); }
  if(d.date){ B.date=d.date; B.start=null; B.station=""; S.bMsg=null; return paintBoard(); }
  if(d.hours){ B.hours=Number(d.hours); B.start=null; B.station=""; S.bMsg=null; return paintBoard(); }
  if(d.start!==undefined){ B.start=Number(d.start); B.station=""; S.bMsg=null; return paintBoard(); }
  if(d.station!==undefined){ B.station=d.station; return paintBoard(); }
  if(d.tab){ S.adm.tab=d.tab; S.adm.msg=null; S.draft=null; return render(); }
  if(d.adate){ S.adm.date=d.adate; S.adm.sel=null; S.adm.msg=null; return render(); }
  if(d.cell){
    try{
      if(d.cell==="free"){ await backend.addWalkin(d.st,Number(d.ms)); S.adm.msg={k:"ok",t:t("walkAdded")}; }
      else if(d.cell==="wk"){ await backend.removeSlot(d.sid); S.adm.msg={k:"ok",t:t("walkRemoved")}; }
      else if(d.cell==="bk"){ S.adm.sel=d.bid; S.confirmId=null; }
    }catch(x){ S.adm.msg={k:"err",t:t("err")}; }
    return render();
  }
  const a=d.act;
  if(a==="signin"){ try{ await backend.signIn(); }catch(x){ S.bMsg={k:"err",t:t("err")}; render(); } }
  else if(a==="signout"){ await backend.signOut(); location.hash=""; }
  else if(a==="book") doBook();
  else if(a==="again"){ S.done=null; paintBoard(); }
  else if(a==="cancel"||a==="acancel"){ S.confirmId=d.id; render(); }
  else if(a==="cancel-no"){ S.confirmId=null; render(); }
  else if(a==="cancel-yes"||a==="acancel-yes"){
    const src=a==="cancel-yes"?S.my:S.dayBookings; const b=src.find(x=>x.id===d.id);
    try{ await backend.cancelBooking(b); const m={k:"ok",t:t("cancelOk")}; if(a==="cancel-yes") S.toast=m; else S.adm.msg=m; }catch(x){ const m={k:"err",t:t("err")}; if(a==="cancel-yes") S.toast=m; else S.adm.msg=m; }
    S.confirmId=null; render();
  }
  else if(a==="close-detail"){ S.adm.sel=null; render(); }
  else if(a==="sheet-close"){ S.sheet=null; render(); }
  else if(a==="st-add"){ const sec=S.draft.sections[Number(d.i)]; const pre=sec.stations[0]?sec.stations[0].id.split("-")[0]:sec.id; let n=sec.stations.length+1; while(sec.stations.some(s=>s.id===`${pre}-${n}`)) n++;
    const lbl=sec.stations[0]?sec.stations[0].name.replace(/\s*\d+$/,""):secName(sec.id); sec.stations.push({id:`${pre}-${n}`,name:`${lbl} ${n}`,open:true}); render(); }
  else if(a==="st-del"){ const [si,i]=d.i.split(":").map(Number); S.draft.sections[si].stations.splice(i,1); render(); }
  else if(a==="save-set"){ try{ await backend.saveSettings(S.draft); S.adm.msg={k:"ok",t:t("saved")}; S.draft=null; }catch(x){ S.adm.msg={k:"err",t:t("err")}; } render(); }
});
document.addEventListener("change",e=>{
  const el=e.target, d=el.dataset; if(!S.draft) return;
  if(d.hour!==undefined){ const h=S.draft.hours[d.hour]; if(d.k==="closed") h.closed=el.checked; else { h[d.k]=Number(el.value); if(h.close<=h.open) h.close=Math.min(h.open+1,30); } render(); }
  else if(d.price!==undefined){ S.draft.sections[Number(d.price)].price=Math.max(0,Number(el.value)||0); }
  else if(d.stname!==undefined){ const [si,i]=d.stname.split(":").map(Number); S.draft.sections[si].stations[i].name=el.value.trim()||S.draft.sections[si].stations[i].name; }
  else if(d.stopen!==undefined){ const [si,i]=d.stopen.split(":").map(Number); S.draft.sections[si].stations[i].open=el.checked; }
  else if(d.rule){ S.draft[d.rule]=Math.max(1,Number(el.value)||1); }
});
document.addEventListener("input",e=>{ if(e.target.id==="bName") S.b.name=e.target.value; if(e.target.id==="bPhone") S.b.phone=e.target.value; });
document.addEventListener("submit",async e=>{ if(e.target.id!=="demoForm") return; e.preventDefault(); const n=$("#dn").value.trim(); if(!n) return; S.sheet=null; await backend.demoSign(n,S.view==="admin"); render(); });
window.addEventListener("hashchange",route);
setInterval(()=>{ if(S.view==="home"&&!(document.activeElement&&document.activeElement.tagName==="INPUT")) paintBoard(); },60000);

/* ---------------- boot ---------------- */
let backend;
(async function boot(){
  try{ backend=DEMO?makeDemo():await makeFirebase(); }
  catch(e){ $("#app").innerHTML=`<div class="wrap"><div class="msg err" style="margin-top:40px">${t("err")}</div></div>`; return; }
  backend.watchSettings(s=>{ S.settings=s&&s.sections?s:null; if(!(S.view==="admin"&&S.adm.tab==="set")) render(); });
  backend.onAuth(u=>{ S.user=u; S.authReady=true; if(u&&!S.b.name) S.b.name=u.name||""; route(); });
  route();
})();
</script>
